name: Fork APK Build

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.caching=true

concurrency:
  group: fork-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build Installable Release APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Cache persistent fork signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fork-release-debug-keystore-v1

      - name: Prepare release signing keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            keystore_path="${RUNNER_TEMP}/fork-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore_path"
            {
              echo "keystore_file=${keystore_path}"
              echo "keystore_password=${KEYSTORE_PASSWORD}"
              echo "key_alias=${KEY_ALIAS}"
              echo "key_password=${KEY_PASSWORD}"
            } >> "$GITHUB_OUTPUT"
          else
            keystore_path="${HOME}/.android/debug.keystore"
            mkdir -p "$(dirname "$keystore_path")"
            if [[ ! -f "$keystore_path" ]]; then
              keytool -genkeypair -noprompt -v \
                -keystore "$keystore_path" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            {
              echo "keystore_file=${keystore_path}"
              echo "keystore_password=android"
              echo "key_alias=androiddebugkey"
              echo "key_password=android"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Install Android NDK
        uses: ./.github/actions/android-ndk

      - name: Verify boundaries, unit tests and lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            verifyModuleBoundaries \
            :platform:verifyDomainDependencies \
            :app:verifyDomainDependencies \
            testDebugUnitTest \
            :app:lintDebug \
            --no-daemon \
            --console=plain \
            --max-workers=2 \
            --stacktrace 2>&1 | tee gradle-build.log

      - name: Assemble Release APK (arm64-v8a)
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_file }}
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.keystore_password }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ steps.signing.outputs.key_password }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --console=plain \
            --max-workers=2 \
            --stacktrace 2>&1 | tee -a gradle-build.log

      - name: Surface Gradle errors as annotations
        if: ${{ !success() }}
        shell: bash
        run: |
          # Emit compiler / test errors or last active tasks (GitHub shows up to 10 annotations per step)
          if [ ! -f gradle-build.log ]; then
            echo "::error::gradle-build.log not found"
            exit 0
          fi
          sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' gradle-build.log > gradle-clean.log || cp gradle-build.log gradle-clean.log
          filter_errors() {
            grep -vE '^[[:space:]]*(w:|Note:|at )|org\.gradle' \
              | grep -E '(^|[[:space:]])e: |[A-Za-z0-9_./-]+\.(kt|java|xml):[0-9]+|error: |AssertionError|Violation|disallowed|Execution failed for task' || true
          }
          {
            grep -E '(^|[[:space:]])e: ' gradle-clean.log || true
            filter_errors < gradle-clean.log
            failed_task=$(grep -oE '> Task [^ ]+ FAILED' gradle-clean.log | awk '{print $3}' | head -n 1 || true)
            if ! grep -qE '(^|[[:space:]])e: ' gradle-clean.log && [[ "$failed_task" == *compile* || "$failed_task" == *Kotlin* ]]; then
              ./gradlew "$failed_task" --no-daemon --console=plain --info 2>&1 \
                | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' \
                | grep -E '(^|[[:space:]])e: |error: |Unresolved|mismatch|conflict' \
                | grep -vE '^[[:space:]]*(w:|Note:|at )|org\.gradle' || true
            fi
            grep -E ' FAILED$' gradle-clean.log | grep -vE '^> Task ' || true
            grep -B 20 -m 1 '> Task .* FAILED' gradle-clean.log | grep -vE '^[[:space:]]*(w:|Note:|at )|> Task ' || true
            grep -E '^> Task ' gradle-clean.log | tail -n 5 || true
            tail -n 5 gradle-clean.log || true
          } | awk '!seen[$0]++' | head -n 10 \
            | while IFS= read -r line; do
                clean=$(printf '%s' "$line" | sed 's#file:///home/runner/work/NeriPlayer/NeriPlayer/##' | cut -c1-400)
                echo "::error::$clean"
              done || true

      - name: Upload Gradle test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fork-gradle-test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.txt
            **/build/reports/problems/**
            gradle-build.log

      - name: Upload Installable Release APK (arm64-v8a)
        uses: actions/upload-artifact@v6
        with:
          name: neriplayer-release-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
